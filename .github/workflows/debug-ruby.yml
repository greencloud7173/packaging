name: Debug ruby
on: workflow_dispatch
jobs:
  ruby:
    runs-on: ubuntu-24.04
    steps:
      - name: Query ruby gems in Fedora 44
        run: |
          docker run --rm "fedora:44" bash -euo pipefail -c '
            dnf -q makecache >/dev/null
            for cap in "rubygem(json)" "rubygem(psych)" "rubygem(yaml)"; do
              echo "=== PROVIDES $cap ==="
              dnf -q repoquery --available --whatprovides "$cap" --qf "%{name}\n" | sort -u
            done
            echo "=== ruby-default-gems files ==="
            dnf -q repoquery --available -l ruby-default-gems | grep -E "json|psych" | head -20
            echo "=== rubygem-psych files ==="
            dnf -q repoquery --available -l rubygem-psych | head -20
            echo "=== dry run install ==="
            dnf install -y --setopt=install_weak_deps=False --downloadonly ruby-default-gems 2>&1 | tail -20
          '
