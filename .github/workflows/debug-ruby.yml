name: Debug ruby
on: workflow_dispatch
jobs:
  ruby:
    runs-on: ubuntu-24.04
    steps:
      - name: Query ruby packaging in Fedora 44
        run: |
          docker run --rm "fedora:44" bash -euo pipefail -c '
            dnf -q makecache >/dev/null
            echo "===PKGS==="
            dnf -q repoquery --available "ruby*" "rubygem-json*" "rubygem-psych*" --qf "%{name}-%{version}-%{release}" | sort -u
            echo "===RUBYINFO==="
            dnf -q repoquery --available --info ruby
            echo "===RUBYLIBSFILES==="
            dnf -q repoquery --available -l ruby-libs | grep -Ei "json|psych|yaml" || true
            echo "===RUBYFILES==="
            dnf -q repoquery --available -l ruby | head -50
          '
